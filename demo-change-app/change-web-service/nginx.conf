server {
    listen 4201;
    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS — re-resolve on each request to handle container IP changes
    resolver 127.0.0.11 valid=10s;

    # Proxy API calls to Spring Boot backend (same Docker network)
    location /change-app-service/api/ {
        set $backend http://change-app-service:8085;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Origin $http_origin;
    }

    # Angular SPA — fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
