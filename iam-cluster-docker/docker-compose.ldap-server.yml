services:
  ldap-server:
    image: ldap-server:latest
    container_name: ldap-server
    restart: unless-stopped
    ports:
      - "10389:10389"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_URL=jdbc:oracle:thin:@//host.docker.internal:1521/AUTHPDB1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - iam-internal-network

# =============================================================================
# Khởi động cùng cluster (join iam-internal-network có sẵn)
# =============================================================================
# docker build -t ldap-server:latest ./ldap-server
# docker compose \
#   -f docker-compose.yml \
#   -f docker-compose.ldap-server.yml \
#   up -d
