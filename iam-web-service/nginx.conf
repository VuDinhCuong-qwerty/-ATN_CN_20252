server {
    listen 4200;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS — re-resolve on each request to handle container IP changes
    resolver 127.0.0.11 valid=10s;

    # Proxy /api/auth -> iam-auth-service (direct, not via gateway)
    location /api/auth/ {
        set $auth_upstream http://iam-auth-service:8888;
        rewrite ^/api/auth/(.*)$ /ms-internal-iam/auth/$1 break;
        proxy_pass $auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy /api/identity -> gateway -> identity-service
    location /api/identity/ {
        set $gw_upstream http://iam-gateway:8080;
        rewrite ^/api/identity/(.*)$ /iam-identity-service/$1 break;
        proxy_pass $gw_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # Proxy /api/app -> gateway -> app-service
    location /api/app/ {
        set $gw_upstream http://iam-gateway:8080;
        rewrite ^/api/app/(.*)$ /iam-app-service/$1 break;
        proxy_pass $gw_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # Angular SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
